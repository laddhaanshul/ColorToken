name: Publish @laddhaanshul/color-tokens to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). Must match a git tag v{version}.'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  REGISTRY_URL: 'https://registry.npmjs.org'
  PACKAGE_NAME: '@laddhaanshul/color-tokens'

jobs:
  # ─── Extract Version ────────────────────────────────────
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Extract version from release tag (e.g., v1.2.3 -> 1.2.3)
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "Source: GitHub Release"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            echo "Source: Manual input"
          else
            echo "::error::No version specified. Use release event or provide version input."
            exit 1
          fi

          # Validate semver format (major.minor.patch)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'. Expected semver (e.g., 1.0.0)."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION (tag: $TAG)"

  # ─── Quality Checks ──────────────────────────────────────
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu --no-save
          fi

      - name: Run type checking
        run: npm run typecheck --workspace=@laddhaanshul/color-tokens

      - name: Run linting
        run: npm run lint --workspace=@laddhaanshul/color-tokens

      - name: Run tests
        run: npm test --workspace=@laddhaanshul/color-tokens

  # ─── Build Package ───────────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu --no-save
          fi

      - name: Update package version
        run: |
          cd packages/color-tokens
          VERSION="${{ needs.prepare.outputs.version }}"
          # Use npm version to update package.json and git tag (no commit needed)
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Updated package.json to version $VERSION"
          cat package.json | grep '"version"'

      - name: Build package
        run: |
          cd packages/color-tokens
          npm run build

      - name: Verify build output
        run: |
          cd packages/color-tokens
          echo "Checking build artifacts..."
          test -f dist/index.js && echo "  CJS build exists"
          test -f dist/esm/index.js && echo "  ESM build exists"
          test -f dist/index.native.js && echo "  Native build exists"
          test -f dist/index.d.ts && echo "  Type declarations exist"
          echo "All 4 build artifacts verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/color-tokens/dist/
          retention-days: 5

  # ─── Publish to npm ──────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        run: |
          npm install
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu --no-save
          fi

      - name: Update package version
        run: |
          cd packages/color-tokens
          VERSION="${{ needs.prepare.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Ready to publish version $VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/color-tokens/dist/

      - name: Check if version already exists on npm
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if npm view ${{ env.PACKAGE_NAME }}@${VERSION} version 2>/dev/null; then
            echo "::error::Version ${VERSION} already exists on npm. Skipping publish."
            exit 1
          fi
          echo "Version ${VERSION} is available for publish."

      - name: Publish to npm
        run: |
          cd packages/color-tokens
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Post-Publish Verification ───────────────────────────
  verify:
    name: Verify Published Package
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify package is available
        run: |
          echo "Waiting for npm registry to propagate..."
          sleep 30
          VERSION="${{ needs.prepare.outputs.version }}"
          npm view ${{ env.PACKAGE_NAME }}@${VERSION} version
          echo "Package ${{ env.PACKAGE_NAME }}@${VERSION} is available on npm."

      - name: Verify package metadata
        run: |
          npm info ${{ env.PACKAGE_NAME }} --json | jq '{
            name: .name,
            version: .["dist-tags"].latest,
            description: .description,
            license: .license
          }'
          echo "Package metadata verified."

  # ─── Update Git Tag (if needed) ─────────────────────────
  tag-sync:
    name: Sync Git Tag
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or move git tag
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          # Check if tag already exists on remote
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote. Skipping."
          else
            echo "Creating tag ${TAG}..."
            git tag -a "$TAG" -m "Release v${VERSION}"
            git push origin "$TAG"
            echo "Tag ${TAG} pushed successfully."
          fi
